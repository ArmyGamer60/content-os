<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; background: #f4f6f9; }
  </style>
</head>
<body>
  <div id="app" style="display:flex;height:100vh;width:100%;overflow:hidden;">
    <aside style="width:236px;flex:none;background:linear-gradient(180deg,#0f1f3d 0%,#0c1a33 100%);display:flex;flex-direction:column;padding:20px 14px;color:#fff;">
      <div style="display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);">
        <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;">C</div>
        <div style="line-height:1.1;flex:1;">
          <div style="font-weight:700;font-size:15px;">Content OS</div>
          <div style="font-size:10px;color:#7e92b3;font-weight:500;">Test Mode</div>
        </div>
      </div>

      <nav style="display:flex;flex-direction:column;gap:3px;flex:1;margin-top:14px;">
        <button onclick="switchTab('calendar')" style="display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:9px;border:none;background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">
          Calendario
          <span style="background:rgba(255,255,255,.2);color:#cad5e8;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:700;margin-left:auto;">0</span>
        </button>
      </nav>

      <button onclick="alert('Test OK - HTML está cargando')" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 11px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#cad5e8;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">
        Test Button
      </button>
    </aside>

    <main style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <header style="height:66px;flex:none;background:#fff;border-bottom:1px solid #e8edf3;display:flex;align-items:center;padding:0 26px;gap:18px;">
        <div style="flex:1;">
          <div style="font-size:18px;font-weight:700;color:#0f1f3d;">Calendario</div>
          <div style="font-size:12.5px;color:#7a8aa0;font-weight:500;">Test Mode - Sin Firebase</div>
        </div>
        <button onclick="alert('HTML está funcionando correctamente')" style="background:#2563eb;color:#fff;border:none;border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">
          Test
        </button>
      </header>

      <div style="flex:1;overflow:auto;padding:24px 26px;">
        <div style="background:#fff;border:1px solid #eef1f5;border-radius:16px;padding:20px;">
          <h2 style="margin:0 0 16px;font-size:16px;font-weight:700;color:#0f1f3d;">Estado: HTML Funcionando ✓</h2>
          <p style="margin:0 0 12px;color:#64748b;font-size:14px;">Si ves esto, el archivo HTML está cargando correctamente.</p>
          <p style="margin:0;color:#94a3b8;font-size:13px;">Si no ves nada, abre F12 → Console para ver errores.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    console.log('✓ HTML cargado correctamente');
    
    function switchTab(tab) {
      console.log('Cambió a tab:', tab);
    }

    // Verificar Firebase
    console.log('Firebase disponible:', typeof firebase !== 'undefined');
  </script>
</body>
</html>

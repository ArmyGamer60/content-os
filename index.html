<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; background: #f4f6f9; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <script>
    // VARIABLES GLOBALES - DECLARADAS PRIMERO
    let app, auth, db;
    let state = { user: null, active: 'calendar', calendar: [], production: [], reports: [], ads: [] };

    const firebaseConfig = {
  apiKey: "AIzaSyAqP6loFQOtZ1gCV7JKEcQHix3DM2T7Fxg",
  authDomain: "content-os-97b63.firebaseapp.com",
  projectId: "content-os-97b63",
  storageBucket: "content-os-97b63.firebasestorage.app",
  messagingSenderId: "707594487675",
  appId: "1:707594487675:web:fd98225e864bea56025fde"
};

    console.log('📄 Página cargó');

    // ESPERAR FIREBASE
    let intentos = 0;
    function esperar() {
      intentos++;
      console.log('Intento', intentos, ':', typeof firebase);
      if (typeof firebase !== 'undefined') {
        console.log('✅ Firebase disponible');
        iniciar();
      } else if (intentos < 10) {
        setTimeout(esperar, 500);
      }
    }
    esperar();

    // INICIALIZAR
    function iniciar() {
      try {
        console.log('Inicializando...');
        if (!firebase.apps.length) {
          app = firebase.initializeApp(firebaseConfig);
        }
        auth = firebase.auth();
        db = firebase.firestore();
        console.log('✅ Firebase OK');
        
        auth.onAuthStateChanged(user => {
          console.log('Usuario:', user?.email || 'anónimo');
          state.user = user;
          render();
          if (user) escuchar();
        });
        render();
      } catch (e) {
        console.error('Error:', e.message);
      }
    }

    // FIRESTORE LISTENER
    function escuchar() {
      ['calendar', 'production', 'reports', 'ads'].forEach(col => {
        db.collection(col).onSnapshot(snap => {
          state[col] = [];
          snap.forEach(doc => state[col].push({ _id: doc.id, ...doc.data() }));
          render();
        });
      });
    }

    // ACCIONES
    window.login = async () => {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
      } catch (e) {
        alert('Error: ' + e.message);
      }
    };

    window.logout = async () => {
      await auth.signOut();
    };

    window.addRow = async () => {
      if (!state.user) return;
      try {
        await db.collection(state.active).add({ createdAt: new Date(), createdBy: state.user.email });
      } catch (e) {
        alert('Error: ' + e.message);
      }
    };

    window.updateCell = async (id, field, value) => {
      try {
        await db.collection(state.active).doc(id).update({ [field]: value });
      } catch (e) {
        console.error(e);
      }
    };

    window.switchTab = (tab) => {
      state.active = tab;
      render();
    };

    // RENDER
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.user) {
        app.innerHTML = `
          <div style="position:fixed;inset:0;background:linear-gradient(135deg,#0f1f3d,#0c1a33);display:flex;align-items:center;justify-content:center;">
            <div style="background:#fff;border-radius:16px;padding:48px;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;">
              <div style="width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff;">C</div>
              <h1 style="margin:0 0 8px;font-size:24px;font-weight:700;color:#0f1f3d;">Content OS</h1>
              <p style="margin:0 0 32px;font-size:14px;color:#64748b;">Colaboración en tiempo real</p>
              <button onclick="window.login()" style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;">Inicia con Google</button>
              <p style="margin:16px 0 0;font-size:12px;color:#94a3b8;">Todos ven los mismos datos</p>
            </div>
          </div>
        `;
        return;
      }

      const rows = state[state.active];
      const tabs = { calendar: 'Calendario', production: 'Producción', reports: 'Reportes', ads: 'Ads' };
      const counts = { calendar: state.calendar.length, production: state.production.length, reports: state.reports.length, ads: state.ads.length };

      app.innerHTML = `
        <div style="display:flex;height:100vh;overflow:hidden;">
          <aside style="width:236px;background:linear-gradient(180deg,#0f1f3d 0%,#0c1a33 100%);display:flex;flex-direction:column;padding:20px 14px;color:#fff;">
            <div style="display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);">
              <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;">C</div>
              <div style="line-height:1.1;">
                <div style="font-weight:700;font-size:15px;">Content OS</div>
                <div style="font-size:10px;color:#7e92b3;">${state.user.email}</div>
              </div>
            </div>

            <nav style="flex:1;margin-top:14px;">
              ${Object.keys(tabs).map(tab => `
                <button onclick="window.switchTab('${tab}')" style="display:flex;gap:11px;width:100%;padding:9px 11px;margin-bottom:3px;border-radius:9px;border:none;background:${state.active === tab ? 'rgba(255,255,255,.08)' : 'transparent'};color:${state.active === tab ? '#fff' : '#8fa5bf'};font:inherit;font-size:13px;font-weight:600;cursor:pointer;">
                  ${tabs[tab]}
                  <span style="margin-left:auto;background:${state.active === tab ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.08)'};border-radius:6px;padding:3px 7px;font-size:10px;">${counts[tab]}</span>
                </button>
              `).join('')}
            </nav>

            <button onclick="window.logout()" style="width:100%;padding:10px 11px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#cad5e8;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">Cerrar sesión</button>
          </aside>

          <main style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
            <header style="height:66px;background:#fff;border-bottom:1px solid #e8edf3;display:flex;align-items:center;padding:0 26px;gap:18px;">
              <div style="flex:1;">
                <div style="font-size:18px;font-weight:700;color:#0f1f3d;">${tabs[state.active]}</div>
                <div style="font-size:12.5px;color:#7a8aa0;font-weight:500;">Todos ven lo mismo en vivo</div>
              </div>
              <button onclick="window.addRow()" style="background:#2563eb;color:#fff;border:none;border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">+ Nueva fila</button>
            </header>

            <div style="flex:1;overflow:auto;padding:24px 26px;">
              <div style="background:#fff;border:1px solid #eef1f5;border-radius:16px;">
                <div style="padding:14px 18px;border-bottom:1px solid #eef1f5;font-weight:700;color:#0f1f3d;">${rows.length} filas</div>
                <div style="overflow:auto;">
                  <table style="width:100%;border-collapse:collapse;">
                    <tbody>
                      ${rows.map(row => `
                        <tr style="border-bottom:1px solid #f1f4f8;">
                          <td style="padding:12px 18px;width:130px;"><input type="date" value="${row.fecha || ''}" onchange="window.updateCell('${row._id}', 'fecha', this.value)" style="border:none;background:0;font:inherit;outline:none;width:100%;" /></td>
                          <td style="padding:12px 18px;width:120px;"><input type="text" value="${row.plataforma || ''}" onchange="window.updateCell('${row._id}', 'plataforma', this.value)" placeholder="Plataforma" style="border:none;background:0;font:inherit;outline:none;width:100%;" /></td>
                          <td style="padding:12px 18px;flex:1;"><input type="text" value="${row.contenido || ''}" onchange="window.updateCell('${row._id}', 'contenido', this.value)" placeholder="Contenido" style="border:none;background:0;font:inherit;outline:none;width:100%;" /></td>
                          <td style="padding:12px 18px;width:140px;"><select onchange="window.updateCell('${row._id}', 'estado', this.value)" style="border:none;background:0;font:inherit;outline:none;width:100%;"><option>—</option><option ${row.estado === 'Idea' ? 'selected' : ''}>Idea</option><option ${row.estado === 'Prod' ? 'selected' : ''}>Prod</option><option ${row.estado === 'Aprobación' ? 'selected' : ''}>Aprobación</option><option ${row.estado === 'Publicado' ? 'selected' : ''}>Publicado</option></select></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
